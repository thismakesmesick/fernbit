<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>on this day</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header id="fernbit">

    <h1>on this day</h1>

    <p>archive scan in progress...</p>

</header>

<main id="main-content">

<section id="scan-section">

    <div id="scan-output">

        <p>booting archive recovery tool...</p>

    </div>

</section>

</main>

<script>

const blog = "thismakesmesick";

const output = document.getElementById("scan-output");

const today = new Date();

const month = String(today.getMonth() + 1).padStart(2, '0');

const day = String(today.getDate()).padStart(2, '0');

const currentYear = today.getFullYear();

output.innerHTML = "";

let foundAnything = false;


// fake loading line
const loading = document.createElement("p");

loading.textContent =
    "SCANNING MEMORY SECTORS...";

output.appendChild(loading);


// create yearly scan entries
for (let year = 2022; year <= currentYear; year++) {

    const wrapper = document.createElement("div");

    wrapper.style.marginBottom = "28px";


    // fake scan bar
    const bar = document.createElement("p");

    bar.textContent =
        "██████████";


    // year label
    const yearText = document.createElement("p");

    yearText.textContent =
        `${year} ARCHIVE SCAN COMPLETE`;


    // link
    const link = document.createElement("a");

    link.href =
        `https://${blog}.tumblr.com/day/${year}/${month}/${day}`;

    link.target = "_blank";

    link.textContent =
        "[ OPEN FILE ]";


    // fake status text
    const status = document.createElement("p");

    status.textContent =
        "MEMORY FRAGMENTS DETECTED";


    wrapper.appendChild(bar);

    wrapper.appendChild(yearText);

    wrapper.appendChild(status);

    wrapper.appendChild(link);

    output.appendChild(wrapper);

    foundAnything = true;
}


// if somehow no years exist
if (!foundAnything) {

    output.innerHTML = `

        <p>SCANNING...</p>

        <br>

        <p>Woah woah not that old yet</p>

    `;
}

</script>

</body>

</html>
