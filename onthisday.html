<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>on this day</title>

<link rel="stylesheet" href="style.css">

<style>

#scan-output p,
#scan-output a {

    margin-bottom: 12px;

}

.scan-line {

    opacity: 0;

    animation: fadeIn 0.4s forwards;

}

@keyframes fadeIn {

    from {
        opacity: 0;
        transform: translateY(4px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

.cursor::after {

    content: "_";

    animation: blink 1s infinite;

}

@keyframes blink {

    0% { opacity: 1; }

    50% { opacity: 0; }

    100% { opacity: 1; }

}

.memory-block {

    margin-bottom: 36px;

    padding-left: 12px;

    border-left: 1px solid currentColor;

}

.memory-link {

    display: inline-block;

    margin-top: 8px;

}

.error-text {

    margin-top: 32px;

}

</style>

</head>

<body>

<header id="fernbit">

    <h1>on this day</h1>

    <p>digital archaeology</p>

</header>

<main id="main-content">

<section id="scan-section">

    <div id="scan-output">

        <p class="cursor">
            booting recovery utility
        </p>

    </div>

</section>

</main>

<script>

const blog = "thismakesmesick";

const output = document.getElementById("scan-output");

const today = new Date();

const month = String(today.getMonth() + 1).padStart(2, '0');

const day = String(today.getDate()).padStart(2, '0');

const currentYear = today.getFullYear();

const loadingMessages = [

    "mounting archive drive...",
    "searching corrupted sectors...",
    "reading emotional residue...",
    "cross-referencing timestamps...",
    "recovered fragments listed below"

];


// helper function
function addLine(text, delay = 0) {

    setTimeout(() => {

        const line = document.createElement("p");

        line.textContent = text;

        line.classList.add("scan-line");

        output.appendChild(line);

    }, delay);

}


// loading sequence
loadingMessages.forEach((msg, index) => {

    addLine(
        "> " + msg,
        700 * (index + 1)
    );

});


// actual archive scan
setTimeout(async () => {

    let foundAnything = false;

    for (let year = 2022; year <= currentYear; year++) {

        const url =
            `https://${blog}.tumblr.com/day/${year}/${month}/${day}`;

        try {

            const response = await fetch(url);

            const html = await response.text();

            // detect tumblr empty page
            if (
                html.toLowerCase().includes("there's nothing here")
            ) {

                continue;

            }

            foundAnything = true;

            const block = document.createElement("div");

            block.classList.add("memory-block");

            const yearLine = document.createElement("p");

            yearLine.textContent =
                `${day}/${month}/${year}`;

            const status = document.createElement("p");

            status.textContent =
                "memory fragment recoverable";

            const link = document.createElement("a");

            link.href = url;

            link.target = "_blank";

            link.textContent =
                "[ excavate archive ]";

            link.classList.add("memory-link");

            block.appendChild(yearLine);

            block.appendChild(status);

            block.appendChild(link);

            output.appendChild(block);

        }

        catch (error) {

            console.error(
                "archive scan failed:",
                error
            );

        }

    }

    // no posts found
    if (!foundAnything) {

        const nothing = document.createElement("p");

        nothing.textContent =
            "Woah woah not that old yet";

        nothing.classList.add("error-text");

        output.appendChild(nothing);

    }

}, 4500);

</script>

</body>

</html>
