<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Converter - fernbit</title>

<style>
body {
    background: #000;
    color: #fff;
    font-family: "Courier New", monospace;
    padding: 2rem;
}

input, textarea, button {
    width: 100%;
    margin-top: 1rem;
    background: #111;
    color: #fff;
    border: 1px solid #333;
    padding: 0.75rem;
    font-family: inherit;
}

button {
    cursor: pointer;
}

label {
    margin-top: 1rem;
    display: block;
    opacity: 0.7;
}
</style>
</head>

<body>

<h2>Markdown → JSON Converter</h2>

<label>Title (only for diary)</label>
<input id="title" placeholder="Post title">

<label>Date</label>
<input id="date" placeholder="DD/MM/YYYY, HH:MM">

<label>Markdown / Status Text</label>
<textarea id="input" rows="10" placeholder="Write your entry or status here..."></textarea>

<button onclick="convertDiary()">Convert Diary</button>
<button onclick="convertStatus()">Convert Status</button>

<label>Generated JSON</label>
<textarea id="output" rows="15" readonly></textarea>

<script>

// helper
function getDateFormats() {
    const now = new Date();

    const displayDate = now.toLocaleString('en-GB', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
    });

    const isoDate = now.toISOString();

    return { displayDate, isoDate };
}


// DIARY CONVERTER
function convertDiary() {
    const input = document.getElementById("input").value;
    const title = document.getElementById("title").value || "Untitled";
    const dateInput = document.getElementById("date");

    let displayDate, isoDate;

    if (dateInput.value) {
        displayDate = dateInput.value;
        isoDate = new Date(dateInput.value).toISOString();
    } else {
        const dates = getDateFormats();
        displayDate = dates.displayDate;
        isoDate = dates.isoDate;
    }

    const lines = input.split("\n");

    let blocks = [];
    let currentBlock = "";
    let inList = false;

    lines.forEach(line => {
        line = line.trim();

        if (line.startsWith("## ")) {
            currentBlock += `<h2>${line.replace("## ", "")}</h2>`;
        } 
        else if (line.startsWith("### ")) {
            currentBlock += `<h3>${line.replace("### ", "")}</h3>`;
        } 
        else if (line.startsWith("- ")) {
            if (!inList) {
                currentBlock += "<ul>";
                inList = true;
            }
            currentBlock += `<li>${line.replace("- ", "")}</li>`;
        } 
        else {
            if (inList) {
                currentBlock += "</ul>";
                inList = false;
            }

            if (line === "") {
                if (currentBlock !== "") {
                    blocks.push(currentBlock);
                    currentBlock = "";
                }
            } else {
                currentBlock += `<p>${line}</p>`;
            }
        }
    });

    if (inList) currentBlock += "</ul>";
    if (currentBlock !== "") blocks.push(currentBlock);

    const jsonOutput = {
        displayDate: displayDate,
        isoDate: isoDate,
        title: title,
        content: blocks
    };

    document.getElementById("output").value =
        JSON.stringify(jsonOutput, null, 2) + ",";
}


// STATUS CONVERTER
function convertStatus() {
    const input = document.getElementById("input").value.trim();
    const dateInput = document.getElementById("date");

    let isoDate;

    if (dateInput.value) {
        isoDate = new Date(dateInput.value).toISOString();
    } else {
        isoDate = new Date().toISOString();
    }

    const jsonOutput = {
        text: input,
        isoDate: isoDate
    };

    document.getElementById("output").value =
        JSON.stringify(jsonOutput, null, 2) + ",";
}


// autofill date
window.onload = () => {
    const { displayDate } = getDateFormats();
    document.getElementById("date").value = displayDate;
};

</script>

</body>
</html>
