<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Converter - fernbit</title>

<style>
body {
    background: #000;
    color: #fff;
    font-family: "Courier New", monospace;
    padding: 2rem;
}

input, textarea, button {
    width: 100%;
    margin-top: 1rem;
    background: #111;
    color: #fff;
    border: 1px solid #333;
    padding: 0.75rem;
    font-family: inherit;
}

button {
    cursor: pointer;
}

label {
    margin-top: 1rem;
    display: block;
    opacity: 0.7;
}
</style>
</head>

<body>

<h2>Markdown → JSON Converter</h2>

<label>Title</label>
<input id="title" placeholder="Post title">

<label>Date</label>
<input id="date" placeholder="DD/MM/YYYY, HH:MM">

<label>Markdown Content</label>
<textarea id="input" rows="10" placeholder="Paste your markdown here..."></textarea>

<button onclick="convert()">Convert</button>

<label>Generated JSON (paste into posts.json)</label>
<textarea id="output" rows="15" readonly></textarea>

<script>
function convert() {
    const input = document.getElementById("input").value;
    const title = document.getElementById("title").value || "Untitled";
    function getCurrentDateTime() {
    const now = new Date();

    const date = now.toLocaleDateString('en-GB'); // DD/MM/YYYY
    const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    return `${date}, ${time}`;
}

const dateInput = document.getElementById("date");
const date = dateInput.value || getCurrentDateTime();90

    const lines = input.split("\n");

    let blocks = [];
    let currentBlock = "";
    let inList = false;

    lines.forEach(line => {
        line = line.trim();

        if (line.startsWith("## ")) {
            currentBlock += `<h2>${line.replace("## ", "")}</h2>`;
        } 
        else if (line.startsWith("### ")) {
            currentBlock += `<h3>${line.replace("### ", "")}</h3>`;
        } 
        else if (line.startsWith("- ")) {
            if (!inList) {
                currentBlock += "<ul>";
                inList = true;
            }
            currentBlock += `<li>${line.replace("- ", "")}</li>`;
        } 
        else {
            if (inList) {
                currentBlock += "</ul>";
                inList = false;
            }

            if (line === "") {
                if (currentBlock !== "") {
                    blocks.push(currentBlock);
                    currentBlock = "";
                }
            } else {
                currentBlock += `<p>${line}</p>`;
            }
        }
    });

    if (inList) currentBlock += "</ul>";
    if (currentBlock !== "") blocks.push(currentBlock);

    const jsonOutput = {
        date: date,
        title: title,
        content: blocks
    };

    // Format nicely for copy-paste
    document.getElementById("output").value =
        JSON.stringify(jsonOutput, null, 2) + ",";
}
    window.onload = () => {
    document.getElementById("date").value = getCurrentDateTime();
};
</script>

</body>
</html>
