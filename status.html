<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Status Log - fernbit</title>

<style>
body {
    background: #000;
    color: #fff;
    font-family: "Courier New", monospace;
    padding: 2rem;
}

#container {
    max-width: 700px;
    margin: 0 auto;
}

input {
    width: 100%;
    padding: 0.75rem;
    margin-bottom: 2rem;
    background: #111;
    border: 1px solid #333;
    color: #fff;
}

.status-entry {
    margin-bottom: 2rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid #222;
}

.status-date {
    font-size: 0.85rem;
    opacity: 0.6;
    margin-bottom: 0.5rem;
}

.status-text {
    line-height: 1.5;
}
</style>
</head>

<body>

<div id="container">
    <h2>Status Log</h2>

    <input 
        type="date" 
        id="dateFilter"
        onchange="filterByDate()"
    >

    <div id="statusList"></div>
</div>

<script>

let allStatuses = [];

async function loadStatuses() {
    const res = await fetch("data/status.json");
    const data = await res.json();

    allStatuses = data.statuses;

    renderStatuses(allStatuses);
}

function renderStatuses(list) {
    const container = document.getElementById("statusList");
    container.innerHTML = "";

    // newest first
    list.sort((a, b) => new Date(b.isoDate) - new Date(a.isoDate));

    list.forEach(status => {
        const date = new Date(status.isoDate);

        const displayDate = date.toLocaleString("en-GB", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        });

        const div = document.createElement("div");
        div.className = "status-entry";

        div.innerHTML = `
            <div class="status-date">${displayDate}</div>
            <div class="status-text">${status.text}</div>
        `;

        container.appendChild(div);
    });
}

function filterByDate() {
    const selected = document.getElementById("dateFilter").value;

    if (!selected) {
        renderStatuses(allStatuses);
        return;
    }

    const filtered = allStatuses.filter(status => {
        return status.isoDate.startsWith(selected);
    });

    renderStatuses(filtered);
}

loadStatuses();

</script>

</body>
</html>
