<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Same shared setup -->
    <meta name="robots" content="noindex, nofollow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>diary</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    
    <section id="diary">
        <h2>oversharing</h2>

        <!-- Scroll container stays the same -->
        <div id="diary-scroll-container">
            <div id="diary-container">
                <!-- Posts will be injected here -->
            </div>
        </div>
    </section>

    <script>
        fetch('/data/posts.json')
            .then(res => res.json())
            .then(posts => {
                const container = document.getElementById('diary-container');

                posts.forEach(post => {
                    const article = document.createElement('article');
                    article.className = 'diary-entry';

                    const contentHTML = post.content
                        .map(p => `<p>${p}</p>`)
                        .join('');

                    article.innerHTML = `
                        <button class="entry-header" aria-expanded="false" type="button">
                            <span class="entry-date">${post.date}</span>
                            <span class="entry-title">${post.title}</span>
                        </button>
                        <div class="entry-content-wrapper" hidden>
                            <div class="entry-content">
                                ${contentHTML}
                            </div>
                        </div>
                    `;

                    container.appendChild(article);
                });

                // Accordion logic (unchanged behavior)
                const entryHeaders = document.querySelectorAll('.entry-header');

                entryHeaders.forEach((header) => {
                    const contentWrapper = header.nextElementSibling;

                    header.addEventListener('click', () => {
                        const isOpening = contentWrapper.hidden;

                        document.querySelectorAll('.entry-content-wrapper').forEach((wrapper) => {
                            wrapper.hidden = true;
                        });

                        entryHeaders.forEach((button) => {
                            button.setAttribute('aria-expanded', 'false');
                        });

                        if (isOpening) {
                            contentWrapper.hidden = false;
                            header.setAttribute('aria-expanded', 'true');
                        }
                    });
                });
            })
            .catch(err => {
                console.error("Failed to load posts:", err);
            });
    </script>

</body>
</html>
